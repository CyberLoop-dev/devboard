name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/aggregate.test.js
      - name: Syntax check inline script
        run: |
          python3 - <<'EOF'
          import re
          html = open("index.html", encoding="utf-8").read()
          open("/tmp/inline.js", "w").write("\n".join(re.findall(r"<script>([\s\S]*?)</script>", html)))
          EOF
          node --check /tmp/inline.js
      - name: No external scripts or stylesheets
        run: |
          if grep -nE '<script[^>]+src=|<link[^>]+rel="stylesheet"' index.html; then
            echo "devboard must stay dependency-free"; exit 1
          fi
